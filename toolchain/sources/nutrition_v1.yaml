# 营养数据初稿（每 100g 或 100ml 可食部）—— gen_nutrition.py 生成 + 人工修正
#
# 分层方法：
#   composition_table  成分表标准值（基础食材）        conf=3
#   recipe_estimate    配方推算（菜品/复合主食/现饮）  conf=2，波动大的降 1
#   rough_estimate     粗略估算（麻辣烫/火锅等）       conf=1
#
# ⚠️ basis_detail / audit_note 用于可追溯，进 App 的 food_library.json 时需裁掉。
# ⚠️ 酒精类（白酒/红酒）宏量配平天然对不上 —— 酒精 7kcal/g 不计入三大营养素，属正常。
# ⚠️ 本轮已修正的错误：奶茶量纲、芝士奶盖茶量纲、椰奶口径、鸡爪偏低、猪血蛋白偏高。

