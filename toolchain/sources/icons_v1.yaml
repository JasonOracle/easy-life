# v1.0 图表清单 —— 「要画哪些食物图标」的唯一事实来源
#
# 定位：一项食物 = 一项数据条目 = 一张专属图（Boss 拍板：不做品类兜底复用）
# 范围：基础食材 + 中式成品菜 + 包装食品，含奶茶品类（v1.0 不做品牌）
# 说明：本文件只管「画什么」，不含任何热量数值。营养数据走另一条线（sources/*.yaml）
#
# 下一步：为每项补 container（视觉容器）+ view（视角），再按下述模板拼 prompt 生图。
# 器皿是第一识别特征，必须人工核（否则会出现「铜锅画成铁盆」这类错误）。
# 视觉容器槽位已生成于 icons_v1_visual.yaml（注意：与数据线的 vessel 计量器具不同义）。

version: "1.0"

# 分类定义：
#   name —— 用于 UI 显示（中文）
#   key  —— 用于目录名与文件名（ASCII）
# 为什么路径必须用 ASCII：中文路径在 URL percent-encoding、跨平台文件系统编码
# （Windows GBK vs Linux/macOS UTF-8）、打包工具与真机文件 API 上都存在兼容风险。
categories:
  - { key: staple,    name: 主食 }
  - { key: dish,      name: 菜品 }
  - { key: protein,   name: 肉类蛋类 }
  - { key: vegetable, name: 蔬菜 }
  - { key: fruit,     name: 水果 }
  - { key: drink,     name: 饮品 }
  - { key: snack,     name: 零食 }

# 生图固定骨架：只替换 {container} / {content} / {toppings} / {state} / {view}
# 规约：说「是什么」，别说「感觉像什么」
#   有效：逐项枚举食材 / 容器材质与形状 / 状态动态词 / 视角词
#   无效：抽象概括（assorted ingredients）
#   有害：主观形容词（milky brown）
prompt_template: >-
  {container}, {content}, {toppings}, {state}, {view},
  pure white background, soft drop shadow, product photography,
  even studio lighting, square composition, high detail,
  no text, no watermark, no logo, no people, no hands

