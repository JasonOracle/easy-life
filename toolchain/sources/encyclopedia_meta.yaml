# [变更日志]
# 内容：食物百科伴生数据源（不触碰 food_library.json）。
#       1) categories：7 类目的双语显示名与类目介绍（通用叙述，不含具体热量数字）；
#       2) reviews：6 档点评模板（light/balanced/protein_rich/carb_heavy/fat_heavy/dense），
#          占位符 {cal} {p} {c} {f} 由 build_encyclopedia.py 按每 100g 营养值运行时填充；
#       3) en_names：353 条食物英文名，AI 起草（text_review: draft），待 Boss 核对；
#       4) badges / guidance：详情页 cls 徽章与三列指引（适宜人群/注意事项/推荐吃法），按 6 档 cls 模板化。
# 分类规则（以每 100g 计，pcal=p*4, ccal=c*4, fcal=f*9, tot=三者之和）：
#   dense: cal>=300 → protein_rich: pcal/tot>=0.40 → fat_heavy: fcal/tot>=0.45
#   → carb_heavy: ccal/tot>=0.65 → light: cal<=80 → 其余 balanced
version: "1.0"
text_review: draft

categories:
  主食:
    name: { zh: 主食, en: Staples }
    intro:
      zh: 主食是每日能量的主要来源，以碳水化合物为主。粗细搭配、控制份量，是让主食吃不超标的关键。
      en: Staples are your main daily energy source, centered on carbohydrates. Mix refined grains with whole grains and watch portions to stay within budget.
  菜品:
    name: { zh: 菜品, en: Dishes }
    intro:
      zh: 菜品是蛋白质与蔬菜的组合担当。同一食材，蒸、煮、炒、炸的热量可以差出数倍，做法比食材更值得留意。
      en: Dishes combine protein and vegetables. The same ingredient can vary several-fold in calories depending on whether it is steamed, boiled, stir-fried or deep-fried.
  肉类蛋类:
    name: { zh: 肉类蛋类, en: Protein }
    intro:
      zh: 肉、蛋、鱼虾与豆制品是优质蛋白的主要来源，也是维持肌肉与饱腹感的关键。优先选择瘦肉与蒸煮做法。
      en: Meat, eggs, seafood and soy products are your best sources of quality protein, key to muscle maintenance and satiety. Prefer lean cuts and gentle cooking.
  蔬菜:
    name: { zh: 蔬菜, en: Vegetables }
    intro:
      zh: 蔬菜热量低、纤维高，是餐盘里可以放心放大份额的部分。深色蔬菜的微量营养素通常更丰富。
      en: Vegetables are low in calories and high in fiber — the part of your plate you can safely enlarge. Darker vegetables generally carry more micronutrients.
  水果:
    name: { zh: 水果, en: Fruits }
    intro:
      zh: 水果提供维生素与纤维，但果糖同样计入热量。每天一份拳头大小为宜，果汁不能替代鲜果。
      en: Fruits deliver vitamins and fiber, but their sugars still count toward calories. A fist-sized daily portion is a good guide; juice is not a substitute for whole fruit.
  饮品:
    name: { zh: 饮品, en: Drinks }
    intro:
      zh: 液体热量最容易被忽略——一杯奶茶可能抵得上一顿饭。点单时留意糖度、奶盖与加料。
      en: Liquid calories are the easiest to overlook — one milk tea can rival a full meal. Watch sugar level, cheese foam and toppings when ordering.
  零食:
    name: { zh: 零食, en: Snacks }
    intro:
      zh: 零食是幸福感来源，也是热量重灾区。解馋讲究「少量、慢吃、留额度」，不必完全戒断。
      en: Snacks bring joy and calories in equal measure. Enjoy small portions slowly and keep them within your daily budget — no need to quit entirely.

reviews:
  light:
    zh: "热量友好：每 100g 约 {cal} kcal，水分与纤维占比高，是可以放心放进餐盘的选择。"
    en: "Calorie-friendly: about {cal} kcal per 100g, high in water and fiber — an easy add to your plate."
  balanced:
    zh: "搭配均衡：每 100g 约 {cal} kcal，蛋白 {p}g / 碳水 {c}g / 脂肪 {f}g，三大营养素比例平稳。"
    en: "Well balanced: about {cal} kcal per 100g with {p}g protein, {c}g carbs and {f}g fat — an even macro split."
  protein_rich:
    zh: "蛋白担当：每 100g 提供约 {p}g 蛋白质，是肌肉与饱腹感的好帮手，控制好总热量即可放心吃。"
    en: "Protein powerhouse: about {p}g of protein per 100g — great for muscle and satiety. Just keep the total ({cal} kcal/100g) in check."
  carb_heavy:
    zh: "能量主力：碳水约 {c}g/100g（{cal} kcal），优先安排在早餐与午餐；运动日更合适，久坐时段建议减半。"
    en: "Energy workhorse: about {c}g carbs per 100g ({cal} kcal). Best at breakfast or lunch, especially on training days — halve it when you are mostly sitting."
  fat_heavy:
    zh: "脂肪偏高：每 100g 脂肪约 {f}g（{cal} kcal），小份品尝、避开油炸做法会更友好。"
    en: "Fat-forward: about {f}g fat per 100g ({cal} kcal). Keep portions small and skip the deep-fried versions."
  dense:
    zh: "热量密集：每 100g 约 {cal} kcal，属于「少量多次」型选手，解馋后记得给当天留出额度。"
    en: "Calorie-dense: about {cal} kcal per 100g. A little-and-often food — budget for it after every treat."

# 详情页徽章与三列指引：按 6 档 cls 模板化（稿面「适宜人群／注意事项／推荐吃法」），零逐条手写
badges:
  light: { zh: 热量友好, en: Light }
  balanced: { zh: 均衡搭配, en: Balanced }
  protein_rich: { zh: 优质蛋白, en: High Protein }
  carb_heavy: { zh: 能量主力, en: Energy }
  fat_heavy: { zh: 脂类偏高, en: Fat-Forward }
  dense: { zh: 热量密集, en: Calorie-Dense }

guidance:
  light:
    audience: { zh: 控重人群、日常大量食用, en: Weight management, everyday volume eating }
    cautions: { zh: 单靠它营养不够，注意搭配蛋白与主食, en: Not a complete meal — pair with protein and staples }
    serving: { zh: 蒸煮凉拌最佳, en: Steam, boil or toss raw }
  balanced:
    audience: { zh: 一般人群, en: General population }
    cautions: { zh: 留意单次份量，累计不超当日目标, en: Watch portion size against your daily budget }
    serving: { zh: 搭配主食与蛋白同食, en: Serve with a staple and a protein }
  protein_rich:
    audience: { zh: 健身人群、青少年、一般人群, en: Active adults, teens, general population }
    cautions: { zh: 肾功能异常者请遵医嘱控制蛋白总量, en: Limit total protein under kidney disease }
    serving: { zh: 蒸煮炖为主，少油烹调, en: Boil, steam or stew with little oil }
  carb_heavy:
    audience: { zh: 运动人群、脑力劳动者, en: Athletes and mentally active days }
    cautions: { zh: 血糖偏高者建议控制份量并搭配膳食纤维, en: Control portions and add fiber if blood sugar is a concern }
    serving: { zh: 优先安排在早午餐, en: Best placed at breakfast or lunch }
  fat_heavy:
    audience: { zh: 一般人群（小份量）, en: General population in small portions }
    cautions: { zh: 胆固醇较高、高血脂人群建议适量食用, en: Go easy if cholesterol or blood lipids run high }
    serving: { zh: 水煮、煎、烤（少油更健康）, en: Poach, pan-sear or grill with minimal oil }
  dense:
    audience: { zh: 高消耗日、运动前后, en: High-output days, around workouts }
    cautions: { zh: 份量极易超标，建议分装小份食用, en: Portions add up fast — pre-portion before eating }
    serving: { zh: 作为加餐少量食用, en: Treat it as a small snack }

