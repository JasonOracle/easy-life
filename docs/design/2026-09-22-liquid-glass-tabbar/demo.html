<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EasyLife 液态玻璃 Tab Bar · 动效 Demo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; gap: 28px; align-items: flex-start;
    justify-content: center; padding: 32px 24px; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0A1612; color: #E6F2EC;
  }
  .stage {
    position: relative; width: 375px; height: 812px; border-radius: 40px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.55); background: #E9F4EF; flex: none;
  }
  .scroller { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; }
  .scroller img { display: block; width: 375px; }

  /* ---------- 胶囊 ---------- */
  .stage {
    --bar-bg: rgba(255,255,255,.78);
    --bar-rim: rgba(255,255,255,.86);
    --bar-refr: rgba(255,255,255,.45);
    --bar-shadow: rgba(10,79,61,.14);
    --bar-blur: 30px;
    --on: #17916B; --off: #8A8A8A; --indicator: rgba(10,79,61,.28);
  }
  .stage.dark {
    --bar-bg: rgba(22,41,36,.72);
    --bar-rim: rgba(255,255,255,.10);
    --bar-refr: rgba(255,255,255,.10);
    --bar-shadow: rgba(0,0,0,.30);
    --on: #52D6AC; --off: #8B9E94; --indicator: rgba(255,255,255,.35);
  }

  /* ---------- 气泡：五层，全部同尺寸（inset:0） ----------
     L1 背景模糊(纱+芯) · L2 液化效果(外圈13px) · L3 高光 · L4 色散 · L5 暗折射边
     对应设计稿图层结构：背景模糊 / 液化效果(液化+蒙版) / 高光 / txt
     关键：中间「糊」、边缘「清」——边缘是压缩后的折射带，越糊越不像玻璃 */
  .bub { position: absolute; top: -7px; left: 0; width: 112px; height: 64px; border-radius: 32px;
         transform: translateX(0); will-change: transform; }
  .bub > i { position: absolute; inset: 0; border-radius: inherit; display: block; }
  /* 只留外圈 13px */
  .ring {
    padding: 13px;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
  }
  /* 只留中间（内容盒） */
  .core {
    padding: 13px;
    -webkit-mask: linear-gradient(#000 0 0) content-box;
    mask: linear-gradient(#000 0 0) content-box;
  }

  /* L1a 白纱：半透白 α≈.40→.58。纱要够薄，背后内容的颜色才透得出来 */
  .bub .veil {
    background: linear-gradient(180deg,
      rgba(255,255,255,.34) 0%, rgba(255,255,255,.42) 52%, rgba(255,255,255,.52) 100%);
    box-shadow: 0 6px 18px rgba(10,79,61,.22), 0 0 9px 2px rgba(255,255,255,.42);
  }
  /* L1b 背景模糊：重模糊，边界羽化 → 外圈才真的比中间「清」 */
  .bub .blur1 {
    -webkit-mask: url(#softcore); mask: url(#softcore);
    -webkit-backdrop-filter: blur(26px) saturate(180%) brightness(1.02);
            backdrop-filter: blur(26px) saturate(180%) brightness(1.02);
  }
  /* L2 液化效果：羽化外圈 13px。refract 档用 url() 位移把背景真的掰弯；
     降级档只加一点饱和，让边缘比中间「浓」一点 */
  .bub .lens {
    -webkit-mask: url(#softring); mask: url(#softring);
    -webkit-backdrop-filter: blur(10px) saturate(200%) brightness(1.04);
            backdrop-filter: blur(10px) saturate(200%) brightness(1.04);
  }
  .refract .bub .lens {
    -webkit-backdrop-filter: url(#lg-lens) blur(6px) saturate(200%) brightness(1.04);
            backdrop-filter: url(#lg-lens) blur(6px) saturate(200%) brightness(1.04);
  }
  /* L3 高光：贴边 2px 亮线 + 一圈柔光晕 */
  .bub .f3 {
    padding: 2px; mix-blend-mode: plus-lighter; filter: blur(1.3px);
    background: linear-gradient(180deg,
      rgba(255,255,255,.55) 0%, rgba(255,255,255,.16) 46%, rgba(255,255,255,.48) 100%);
  }
  .bub .f3b {
    padding: 10px; mix-blend-mode: plus-lighter; filter: blur(4px);
    background: linear-gradient(180deg,
      rgba(255,255,255,.14) 0%, rgba(255,255,255,.02) 40%, rgba(255,255,255,0) 62%, rgba(255,255,255,.10) 100%);
  }
  /* L4 色散：最外 2px 冷暖双色（左冷右暖），压到「刚好看得见」*/
  .bub .f4 {
    padding: 2px; mix-blend-mode: plus-lighter; filter: blur(.7px);
    background: conic-gradient(from 200deg,
      rgba(120,236,255,.62), rgba(120,236,255,0) 22%,
      rgba(255,255,255,0) 40%, rgba(255,178,96,0) 50%,
      rgba(255,176,92,.58) 68%, rgba(255,176,92,0) 88%, rgba(120,236,255,.45));
  }
  /* L5 暗折射边：一条很轻的下缘压深，别做成描边 */
  .bub .edge {
    padding: 1.2px; mix-blend-mode: multiply;
    background: linear-gradient(180deg,
      rgba(10,79,61,.14) 0%, rgba(10,79,61,.04) 45%, rgba(10,79,61,.14) 100%);
  }

  .stage.dark .bub .veil {
    background: linear-gradient(180deg,
      rgba(255,255,255,.06) 0%, rgba(255,255,255,.11) 52%, rgba(255,255,255,.19) 100%);
    box-shadow: 0 6px 18px rgba(0,0,0,.42), 0 0 9px 2px rgba(255,255,255,.20);
  }
  .stage.dark .bub .blur1 {
    -webkit-backdrop-filter: blur(26px) saturate(170%) brightness(1.02);
            backdrop-filter: blur(26px) saturate(170%) brightness(1.02);
  }
  .stage.dark .bub .lens {
    -webkit-backdrop-filter: blur(3px) saturate(300%) brightness(1.06);
            backdrop-filter: blur(3px) saturate(300%) brightness(1.06);
  }
  .stage.dark.refract .bub .lens {
    -webkit-backdrop-filter: url(#lg-lens) blur(3px) saturate(300%) brightness(1.06);
            backdrop-filter: url(#lg-lens) blur(3px) saturate(300%) brightness(1.06);
  }
  .stage.dark .bub .f3 {
    background: linear-gradient(180deg,
      rgba(255,255,255,.58) 0%, rgba(255,255,255,.15) 46%, rgba(255,255,255,.50) 100%); }
  .stage.dark .bub .f3b {
    background: linear-gradient(180deg,
      rgba(255,255,255,.26) 0%, rgba(255,255,255,.04) 40%, rgba(255,255,255,0) 62%, rgba(255,255,255,.20) 100%); }
  .stage.dark .bub .edge {
    background: linear-gradient(180deg,
      rgba(0,0,0,.50) 0%, rgba(0,0,0,.16) 45%, rgba(0,0,0,.42) 100%); }

  /* 降级档：device.backdropBlur=false（安卓小程序 / uni-app x 原生） */
  .flat .bub .veil { background: #FFFFFF; box-shadow: 0 6px 18px rgba(10,79,61,.18); }
  .flat .bub .blur1, .flat .bub .lens, .flat .bub .f3, .flat .bub .f3b, .flat .bub .f4 { display: none; }
  .flat .bub .edge { mix-blend-mode: normal; background: none; box-shadow: inset 0 0 0 1px #E3EFE8; }
  .flat .bar { background-color: #F8FCFA; border-color: #E3EFE8; backdrop-filter: none;
               background-image: none; }
  .flat.scrollable .bub .edge { box-shadow: inset 0 0 0 1px #E3EFE8; }

  .bar {
    position: absolute; left: 16px; right: 16px; bottom: 22px; height: 56px;
    border-radius: 28px; border: 1px solid var(--bar-rim);
    background-color: var(--bar-bg);
    background-image: linear-gradient(180deg, var(--bar-refr) 0%, rgba(255,255,255,0) 45%);
    box-shadow: 0 8px 24px var(--bar-shadow);
    -webkit-backdrop-filter: blur(var(--bar-blur)) saturate(180%);
    backdrop-filter: blur(var(--bar-blur)) saturate(180%);
  }
  .indicator {
    position: absolute; left: 136px; bottom: 9px; width: 103px; height: 4px; border-radius: 2px;
    background: var(--indicator);
  }
  .tabs { position: absolute; inset: 0; display: flex; z-index: 2; }
  .tab {
    flex: 1; border: 0; background: none; padding: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font: 600 12px/1 Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--off);
    -webkit-tap-highlight-color: transparent;
  }
  .tab img { width: 22px; height: 22px; display: block; }
  .tab.on { color: var(--on); }
  .tab.on img { animation: pop var(--pop-ms, 260ms) ease-out both; }
  @keyframes pop { 0% { transform: scale(.90) } 55% { transform: scale(1.08) } 100% { transform: scale(1) } }

  /* ---------- 控制面板 ---------- */
  .panel { width: 300px; flex: none; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  .sub { font-size: 12px; color: #8B9E94; margin: -8px 0 0; }
  .grp { display: flex; flex-direction: column; gap: 7px; }
  .grp > b { font-size: 11px; color: #8B9E94; font-weight: 600; letter-spacing: .06em; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row button {
    font: 500 12px/1 Inter, "PingFang SC", sans-serif; padding: 8px 12px; border-radius: 10px;
    border: 1px solid #2A4238; background: #162924; color: #8B9E94; cursor: pointer;
  }
  .row button.sel { background: #1A3B2F; color: #52D6AC; border-color: #52D6AC; }
  .read {
    font: 500 11px/1.7 ui-monospace, Consolas, monospace; background: #162924; border: 1px solid #2A4238;
    border-radius: 12px; padding: 12px; white-space: pre; color: #8B9E94;
  }
  .read span { color: #52D6AC; }
  .tip { font-size: 11px; line-height: 1.6; color: #6E8079; margin: 0; }
</style>
</head>

  <div class="panel">
    <h1>液态玻璃 Tab Bar</h1>
    <p class="sub">滚动页面看真实背景模糊；点 Tab 看气泡液态位移。</p>
    <div class="grp"><b>主题</b><div class="row" id="gTheme">
      <button data-v="light" class="sel">浅色</button><button data-v="dark">暗黑</button>
    </div></div>
    <div class="grp"><b>材质</b><div class="row" id="gMat">
      <button data-v="glass" class="sel">真玻璃 backdrop-filter</button><button data-v="flat">降级 假玻璃</button>
    </div></div>
    <div class="grp"><b>折射</b><div class="row" id="gRefr">
      <button data-v="on" class="sel">真·液化 位移</button><button data-v="off">分层遮罩（可落地）</button>
    </div></div>
    <div class="grp"><b>时长</b><div class="row" id="gSpeed">
      <button data-v="1" class="sel">1×</button><button data-v="0.25">慢放 0.25×</button>
    </div></div>
    <div class="grp"><b>当前状态</b><div class="read" id="read"></div></div>
    <p class="tip">「真·液化 位移」用 SVG 位移图把背景真正掰弯，只有浏览器能跑；
    小程序 / uni-app x 原生请用「分层遮罩」，观感接近且性能便宜。</p>
  </div>

<script>
const TABS = [
  { key: 'home',   label: '首页', cx: 57.17 },
  { key: 'rili',   label: '日历', cx: 171.5 },
  { key: 'center', label: '我的', cx: 285.83 }
];
const BAR_W = 343, BUB_W = 112;  // 气泡 112×64，上下各溢出胶囊 4px
const stage = document.getElementById('stage');
const bubble = document.getElementById('bubble');
const tabsEl = document.getElementById('tabs');
const read = document.getElementById('read');
const shot = document.getElementById('shot');

const K = { down: 90, move: 320, settle: 120, lag: 40 };
let scale = 1, cur = 0, theme = 'light';
const ms = v => Math.round(v * scale);
const easeMove = 'cubic-bezier(.34,1.56,.64,1)';
const xOf = i => TABS[i].cx - BUB_W / 2 + (BAR_W - 343) / 2;
const icon = i => theme === 'dark'
  ? `assets/tab_${TABS[i].key}_${i === cur ? 'on_' : ''}dk.png`
  : `assets/tab_${TABS[i].key}${i === cur ? '_on' : ''}.png`;

TABS.forEach((t, i) => {
  const b = document.createElement('button');
  b.className = 'tab' + (i === 0 ? ' on' : '');
  b.innerHTML = `<img src="${icon(i)}" alt=""><span>${t.label}</span>`;
  b.addEventListener('pointerdown', () => press(i));
  b.addEventListener('click', () => go(i));
  tabsEl.appendChild(b);
});

function paint() {
  [...tabsEl.children].forEach((el, i) => {
    el.classList.toggle('on', i === cur);
    el.querySelector('img').src = icon(i);
  });
}
function show(state, sx, sy, dur) {
  read.innerHTML =
    `state   : <span>${state}</span>\n` +
    `tab     : <span>${TABS[cur].label}</span>\n` +
    `scale   : <span>${sx.toFixed(2)} × ${sy.toFixed(2)}</span>\n` +
    `duration: <span>${dur}ms</span>\n` +
    `easing  : <span>${dur ? easeMove : '—'}</span>\n` +
    `blur    : <span>bar 26 / 面 24 / 液化环 13</span>\n` +
    `面纱 α  : <span>bar .62 / 面 .40→.58</span>\n` +
    `layers  : <span>背景模糊 · 液化 · 高光 · 色散 · 暗边</span>`;
}

function press(i) {
  if (i === cur) return;
  bubble.style.transition = `transform ${ms(K.down)}ms ease-out`;
  bubble.style.transform = `translateX(${xOf(cur)}px) scale(.96)`;
  show('按下 touch-down', .96, .96, ms(K.down));
}

function go(i) {
  if (i === cur) return;
  bubble.style.transition = `transform ${ms(K.move)}ms ${easeMove}`;
  bubble.style.transform = `translateX(${xOf(i)}px) scale(1.12, .94)`;
  show('移动中 travel', 1.12, .94, ms(K.move));
  setTimeout(() => {
    cur = i; paint();
    const im = tabsEl.children[i].querySelector('img');
    im.style.animation = 'none'; void im.offsetWidth; im.style.animation = '';
  }, ms(K.move) / 2 + ms(K.lag));
  setTimeout(() => {
    bubble.style.transition = `transform ${ms(K.settle)}ms cubic-bezier(.3,0,.2,1)`;
    bubble.style.transform = `translateX(${xOf(i)}px) scale(1.06, .97)`;
    show('落位 settle', 1.06, .97, ms(K.settle));
    setTimeout(() => {
      bubble.style.transition = `transform ${ms(K.settle)}ms ease-out`;
      bubble.style.transform = `translateX(${xOf(i)}px) scale(1, 1)`;
      show('静止 idle', 1, 1, 0);
    }, ms(K.settle));
  }, ms(K.move));
  if (navigator.vibrate) navigator.vibrate(8);
}

document.getElementById('gTheme').onclick = e => {
  if (e.target.dataset.v) {
    theme = e.target.dataset.v;
    stage.classList.toggle('dark', theme === 'dark');
    shot.src = 'assets/home-' + theme + '.png';
    paint();
    [...e.currentTarget.children].forEach(b => b.classList.toggle('sel', b === e.target));
  }
};
document.getElementById('gMat').onclick = e => {
  if (e.target.dataset.v) {
    stage.classList.toggle('flat', e.target.dataset.v === 'flat');
    [...e.currentTarget.children].forEach(b => b.classList.toggle('sel', b === e.target));
  }
};
document.getElementById('gRefr').onclick = e => {
  if (e.target.dataset.v) {
    stage.classList.toggle('refract', e.target.dataset.v === 'on');
    [...e.currentTarget.children].forEach(b => b.classList.toggle('sel', b === e.target));
  }
};
document.getElementById('gSpeed').onclick = e => {
  if (e.target.dataset.v) {
    scale = parseFloat(e.target.dataset.v);
    document.documentElement.style.setProperty('--pop-ms', ms(260) + 'ms');
    [...e.currentTarget.children].forEach(b => b.classList.toggle('sel', b === e.target));
  }
};
bubble.style.transform = `translateX(${xOf(0)}px)`;
show('静止 idle', 1, 1, 0);

// 注意：CSS.supports('backdrop-filter','url(#x)') 会误报 false（Chrome/Safari 其实支持），
// 所以不做能力探测，默认走「真·液化」，跑不动的平台请手动切「分层遮罩」。
const h = location.hash.slice(1).split(/[.,&]/);
if (h.includes('dark')) document.querySelector('#gTheme [data-v=dark]').click();
if (h.includes('flat')) document.querySelector('#gMat [data-v=flat]').click();
if (h.includes('norefr')) document.querySelector('#gRefr [data-v=off]').click();
if (h.includes('slow')) document.querySelector('#gSpeed [data-v="0.25"]').click();
const g = h.find(x => /^go\d$/.test(x));
if (g) setTimeout(() => go(+g[2]), 60);
const sc = h.find(x => /^sc=/.test(x));
if (sc) setTimeout(() => { document.getElementById('scroller').scrollTop = +sc.split('=')[1]; }, 40);
</script>
</body>
</html>
